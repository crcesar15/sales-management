name: Deploy Laravel to Hostinger

on:
  push:
    branches:
    - master
  workflow_dispatch:


permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    env:
      SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
      SSH_USER: ${{ secrets.HOSTINGER_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
      SSH_PORT: "65002"
      APP_DIR: ${{ vars.HOSTINGER_APP_DIR }}
      WEB_DIR: ${{ vars.HOSTINGER_WEB_DIR }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup PHP 8.5
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        tools: composer:v2
        coverage: none

    - name: Install Composer dependencies for build
      run: composer install --no-interaction --prefer-dist --no-progress

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm

    - name: Install JavaScript dependencies
      run: npm ci

    - name: Build Vue and Inertia assets
      run: npm run build

    - name: Configure SSH
      run: |
        mkdir -p "$HOME/.ssh"
        printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
        chmod 600 "$HOME/.ssh/id_ed25519"
        printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
        chmod 600 "$HOME/.ssh/known_hosts"

    - name: Prepare Hostinger public index.php
      run: |
        set -euo pipefail

        # The Laravel project is deployed to a sibling directory named "sales".
        # Keep the repository's original public/index.php unchanged.
        sed \
          -e "s#__DIR__.'/../vendor/autoload.php#__DIR__.'/../sales/vendor/autoload.php#g" \
          -e "s#__DIR__.'/../bootstrap/app.php#__DIR__.'/../sales/bootstrap/app.php#g" \
          -e "s#__DIR__.'/../storage/framework/maintenance.php#__DIR__.'/../sales/storage/framework/maintenance.php#g" \
          public/index.php > /tmp/hostinger-index.php

        # Fail before deployment if Laravel's required references weren't updated.
        grep -Fq "__DIR__.'/../sales/vendor/autoload.php'" /tmp/hostinger-index.php
        grep -Fq "__DIR__.'/../sales/bootstrap/app.php'" /tmp/hostinger-index.php
        php -l /tmp/hostinger-index.php

    - name: Deploy to Hostinger
      run: |
        set -euo pipefail

        # Prevent deployment to an unexpected directory.
        if [[ "$APP_DIR" != */sales || "$WEB_DIR" != */public_html ]]; then
          echo 'Unexpected Hostinger paths. Check HOSTINGER_APP_DIR and HOSTINGER_WEB_DIR.' >&2
          exit 1
        fi

        RSYNC_SSH="ssh -i $HOME/.ssh/id_ed25519 -p $SSH_PORT -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"

        ssh -i "$HOME/.ssh/id_ed25519" \
          -p "$SSH_PORT" \
          -o BatchMode=yes \
          -o IdentitiesOnly=yes \
